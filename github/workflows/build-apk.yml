
name: TALABI Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q 'talabi-project(1).zip' -d project
          find project -name package.json

