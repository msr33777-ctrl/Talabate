
name: TALABI Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          ls -la
          test -f talabi-project.zip

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q talabi-project.zip -d project
          find project -name package.json
