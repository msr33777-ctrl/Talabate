
name: TALABI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check ZIP
        run: test -f talabi-project3.zip

      - name: Extract project
        run: |
          mkdir project
          unzip -q talabi-project3.zip -d project
          find project -name package.json
          find project -name gradlew

      - name: Build Android APK
        run: |
          cd "$(dirname "$(find project -name gradlew -type f | head -n 1)")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: talabi-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
